<script>
(() => {
  const b64 = s => btoa(unescape(encodeURIComponent(s)));
  const toHex = s => [...s].map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join('');
  const rot13 = s => s.replace(/[a-z]/gi,c=>String.fromCharCode((c<='Z'?90:122)>=(c=c.charCodeAt(0)+13)?c:c-26));
  const rev = s => [...s].reverse().join('');
  const xorHex = (s,k) => [...s].map((c,i)=>(c.charCodeAt(0)^k.charCodeAt(i%k.length)).toString(16).padStart(2,'0')).join('');
  const urlBlob = f => '<!-- debug: secret%3D'+f.slice(4).replace(/\{/g,'%7B').replace(/\}/g,'%7D')+' -->';
  const b64url = s => b64(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const toDec = s => [...s].map(c=>c.charCodeAt(0)).join(' ');
  const makeJWT = flag => {
    const h=b64url(JSON.stringify({alg:'HS256',typ:'JWT'}));
    const p=b64url(JSON.stringify({user:'admin',flag:flag,iat:1716239022}));
    return h+'.'+p+'.c2lnbmF0dXJlX2RlbW8';
  };

      endScore:'Toplam puan:', restart:'Baştan başla', scoreWord:'PUAN',
      switchWarn:'Dili değiştirmek oyunu baştan başlatır (bayraklar farklı). Devam edilsin mi?',
      about:`
        <h2>Bu oyun nedir?</h2>
        <p>Tarayıcıda oynanan <strong>ücretsiz bir CTF (Capture The Flag) bulmaca oyunudur</strong>.
        Her seviyede gizlenmiş bir <em>bayrağı</em> (flag) çözmeni ister; her doğru cevap bir sonrakini açar.
        </p>
        <h2>Neler öğreniyorsun?</h2>
        <p> <strong>Base64</strong>, <strong>hex</strong>,
        <strong>ROT13</strong>, <strong>XOR</strong>, <strong>URL kodlama</strong>, <strong>katmanlı kodlama</strong>,
        <strong>ASCII</strong> ve <strong>JWT</strong>.
        Her seviye çözüldüğünde o tekniğin ne olduğunu anlatan kısa bir açıklama belirir.</p>
        <h2>Kimler için?</h2>
        <p><strong>Siber güvenliğe yeni başlayanlar</strong>, öğrenciler, bulmaca ve zeka oyunu sevenler için.
        Kurulum gerekmez, üyelik istemez; sayfayı aç ve oynamaya başla.</p>`
    },
    en:{
      tagline:'// find the flag, unlock the next level',
      submit:'Submit', hint:'Hint', solved:'Solved',
      locked:'🔒 Locked — find the previous flag first.',
      correct:'✔ Correct! Next level unlocked.',
      wrong:'✗ Wrong flag. Try again.',
      infoLabel:'info', endMsg:'You captured every flag. 🏴',
      endScore:'Total score:', restart:'Start over', scoreWord:'SCORE',
      switchWarn:'Switching language restarts the game (the flags are different). Continue?',
      about:`
        <h2>What is this game?</h2>
        <p>This is a <strong>free, browser-based CTF (Capture The Flag) puzzle game</strong>.
        On each level you decode a hidden <em>flag</em>; every correct answer unlocks the next.
        </p>
        <h2>What will you learn?</h2>
        <p>You practice core encoding and crypto techniques: <strong>Base64</strong>, <strong>hex</strong>,
        <strong>ROT13</strong>, <strong>XOR</strong>, <strong>URL encoding</strong>, <strong>layered encoding</strong>,
        <strong>ASCII</strong> and <strong>JWT</strong>.
        Each time you solve a level, a short explanation of that technique appears.</p>
        <h2>Who is it for?</h2>
        <p><strong>Cybersecurity beginners</strong>, students, and puzzle lovers.
        No setup, no sign-up required — just open the page and start playing.</p>`
    }
  };

  const LEVELS = {
    tr:[
      {cat:'ENCODING', title:'Başlangıç',
       desc:'Bir sistem logunda bu satıra rastladın. Sence ne yazıyor?',
       make:f=>({blob:b64(f),answer:f}), flag:'flag{base64_isinma_turu}',
       hint:'Karakter seti `A-Z a-z 0-9 + /`, uzunluk 4\'ün katı. `atob()` ya da `base64 -d`.',
       info:'<b>Base64 nedir?</b> Base64, ikili (binary) verileri metin olarak taşımak ve saklamak için kullanılan bir kodlama yöntemidir. Şifreleme değildir; veriyi gizlemez, sadece farklı bir formata dönüştürür ve kolayca geri çözülebilir.'},
      {cat:'ENCODING', title:'Onaltılık',
       desc:'Bir pcap içinden bu payload çıktı. İçinde ne saklı?',
       make:f=>({blob:toHex(f),answer:f}), flag:'flag{hex_okumak_kolay}',
       hint:'Her iki karakter bir byte. `xxd -r -p` veya hex→ASCII çevirici.',
       info:'<b>Hex nedir?</b> Hex (hexadecimal), sayıları 16 tabanında gösteren bir sayı sistemidir ve 0–9 ile A–F karakterlerini kullanır. Bilgisayarlarda bellek adresleri, renk kodları ve ikili verilerin daha okunabilir şekilde gösterilmesi için yaygın olarak kullanılır.'},
      {cat:'CRYPTO', title:'Sezar gölgesi',
       desc:'Bu yazıda bir terslik var ama harfler tanıdık duruyor. Çöz:',
       make:f=>({blob:rot13(f),answer:f}), flag:'flag{rot13_caesar_baby}',
       hint:'Her harf 13 ileri kaymış. ROT13 kendi tersidir — tekrar uygula geri gelir.',
       info:'<b>ROT13 nedir?</b> ROT13, alfabedeki her harfi 13 karakter ileri kaydıran basit bir metin dönüştürme yöntemidir. Güvenli bir şifreleme değildir; aynı işlem ikinci kez uygulandığında orijinal metin geri elde edilir.'},
      {cat:'RECON', title:'Ters köşe',

      {cat:'CRYPTO', title:'Tek anahtar (XOR)',
       desc:'Aşağıdaki hex bir anahtarla karıştırılmış. Anahtar tek bir karakter. Geri çevir:',

      {cat:'FORENSICS', title:'Çift kat',

       hint:'Bir kez çöz → hâlâ base64 → bir kez daha çöz.',
       info:'<b>Çift Base64 nedir?</b> Çift Base64 (Double Base64), bir verinin Base64 ile kodlandıktan sonra ortaya çıkan sonucun tekrar Base64 ile kodlanması işlemidir. Güvenlik sağlamaz; yalnızca veriyi iki kez kodladığı için çözmek için de iki kez Base64 decode işlemi yapılması gerekir.'},
      {cat:'WEB', title:'Gizli yorum',
       desc:'Bir sayfanın kaynağında şu HTML yorumu duruyor. İçinde bir şey gizli:',
       make:f=>({blob:urlBlob(f),answer:f}), flag:'flag{url_decode_lazim}',
       hint:'%3D → "=", %7B → "{", %7D → "}". `decodeURIComponent()` ile çöz. secret= sonrası süslü parantezli kısım; başına "flag" ekle.',
       info:'<b>URL Decode nedir?</b> URL Decode, URL içinde özel karakterlerin <code>%20</code>, <code>%2F</code> gibi yüzde işaretli kodlardan tekrar gerçek karakterlerine dönüştürülmesi işlemidir. Web uygulamalarında URL üzerinden güvenli şekilde taşınan verilerin okunabilir hale getirilmesi için kullanılır.'},
      {cat:'WEB', title:'Token içi (JWT)',
       desc:'Bir oturum token\'ı yakaladın. İçinde bir yerde flag saklı — bul:',
       make:f=>({blob:makeJWT(f),answer:f}),
       flag:'flag{jwt_payload_acik}',
       hint:'Token\'ı noktalardan üçe böl. Ortadaki parçayı base64 decode et → bir JSON çıkar. JSON içindeki "flag" alanına bak. (jwt.io ya da `atob`)',
       info:'<b>JWT nedir?</b> JWT (JSON Web Token), web uygulamalarında kimlik ve oturum bilgisi taşımak için kullanılan, noktayla ayrılmış üç parçadan (başlık.veri.imza) oluşan bir formattır. Ortadaki "payload" kısmı sadece kodlanmıştır (Base64\'ün URL-güvenli bir varyantı olan Base64URL ile) — şifreli değildir, herkes okuyabilir. Bu yüzden JWT içine asla parola gibi hassas bilgi konmaz.'},
      {cat:'ENCODING', title:'Sayıların dili',
       desc:'Bir veri akışında sadece sayılar var. Bu sayılar bir şeye karşılık geliyor:',

       hint:'Bunlar ASCII kodları. Her sayı bir karaktere karşılık gelir (örn. 102 = "f", 108 = "l"). Her sayıyı harfe çevir. (`String.fromCharCode` ya da bir ASCII tablosu)',

       hint:'1) base64 decode → karışık string. 2) ters çevir → bayrak.',
       info:'<b>Base64 + Reverse nedir?</b> Base64 + Reverse, bir verinin önce Base64 ile kodlanıp ardından ortaya çıkan metnin ters çevrilmesi işlemidir. Bu bir şifreleme yöntemi değildir; orijinal veriyi elde etmek için önce metin tekrar ters çevrilir, ardından Base64 decode işlemi uygulanır.'}
    ],
    en:[
      {cat:'ENCODING', title:'Warm-up',
       desc:'You found this line in a system log. What does it say?',
       make:f=>({blob:b64(f),answer:f}), flag:'flag{base64_warmup}',
       hint:'Character set `A-Z a-z 0-9 + /`, length a multiple of 4. Use `atob()` or `base64 -d`.',
       info:'<b>What is Base64?</b> Base64 is an encoding method used to carry and store binary data as text. It is not encryption; it does not hide the data, it only converts it to a different format and can be easily decoded back.'},

       desc:'The file content looks odd. Try starting from somewhere:',
       make:f=>({blob:rev(f),answer:f}), flag:'flag{read_it_backwards}',
       hint:'The string is reversed. Use `rev` or [...s].reverse().',
       info:'<b>What is reversing?</b> Reversing flips the order of characters in a string from end to start. It provides no security; it is just a simple transformation that shows the data in a different appearance.'},
      {cat:'CRYPTO', title:'Single key (XOR)',
       desc:'The hex below was mixed with a key. The key is a single character. Reverse it:',
       make:f=>({blob:xorHex(f,'K'),answer:f}), flag:'flag{xor_single_key}',
       hint:'This is XOR. The key is one byte: "K". Split the hex into bytes and XOR each with "K".',
       info:'<b>What is XOR?</b> XOR (Exclusive OR) is a logical operation that compares two bits or pieces of data and outputs 1 only when exactly one of them is 1. In cryptography it is used for simple encryption and data masking; applying XOR again with the same key recovers the original data.'},
      {cat:'FORENSICS', title:'Double layer',
       desc:'Where you think you\'re done, you\'re not. Look once more:',
       make:f=>({blob:b64(b64(f)),answer:f}), flag:'flag{double_base64}',
       hint:'Decode once → still base64 → decode once more.',
       info:'<b>What is Double Base64?</b> Double Base64 means encoding data with Base64 and then encoding the result with Base64 once more. It provides no security; since the data is encoded twice, you simply need to run Base64 decode twice to recover it.'},
      {cat:'WEB', title:'Hidden comment',
       desc:'This HTML comment sits in a page\'s source. Something is hidden inside:',
       make:f=>({blob:urlBlob(f),answer:f}), flag:'flag{url_decode_me}',
       hint:'%3D → "=", %7B → "{", %7D → "}". Decode with `decodeURIComponent()`. After secret= comes the flag in braces; add "flag" in front.',
       info:'<b>What is URL Decode?</b> URL Decode converts percent-encoded sequences like <code>%20</code> or <code>%2F</code> inside a URL back into their real characters. It is used in web applications to make data safely carried over URLs readable again.'},
      {cat:'WEB', title:'Inside the token (JWT)',
       desc:'You captured a session token. The flag is hidden somewhere inside it — find it:',
       make:f=>({blob:makeJWT(f),answer:f}),
       flag:'flag{jwt_payload_exposed}',
       hint:'Split the token at the dots into three parts. Base64-decode the middle part → you get JSON. Look at the "flag" field. (jwt.io or `atob`)',
       info:'<b>What is JWT?</b> A JWT (JSON Web Token) carries identity and session data in web apps. It has three dot-separated parts (header.payload.signature). The middle "payload" is only encoded (with Base64URL, a URL-safe variant of Base64) — not encrypted, anyone can read it. That\'s why you never put secrets like passwords inside a JWT.'},
      {cat:'ENCODING', title:'The language of numbers',
       desc:'A data stream contains only numbers. These numbers map to something:',
       make:f=>({blob:toDec(f),answer:f}),
       flag:'flag{ascii_table}',
       hint:'These are ASCII codes. Each number maps to a character (e.g. 102 = "f", 108 = "l"). Convert each number to its letter. (`String.fromCharCode` or an ASCII table)',
       info:'<b>What is ASCII?</b> ASCII is a character-encoding standard that maps letters, digits and symbols to numbers (e.g. "A" = 65, "a" = 97). Computers actually store text as these numbers; converting a sequence of numbers back to characters recovers the text.'},
      {cat:'CRYPTO', title:'Final: layered chain',
       desc:'The home stretch. No single trick this time — several layers stacked. Solve it:',
       make:f=>({blob:b64(rev(f)),answer:f}), flag:'flag{you_solved_the_chain}',
       hint:'1) base64 decode → scrambled string. 2) reverse it → the flag.',
       info:'<b>What is Base64 + Reverse?</b> Base64 + Reverse means encoding data with Base64 and then reversing the resulting text. It is not encryption; to recover the original you first reverse the text again, then apply Base64 decode.'}
    ]
  };

  let lang = 'tr', progress = 0, score = 0;
  const levelsEl = document.getElementById('levels');
  const progEl = document.getElementById('prog');
  const endEl = document.getElementById('end');
  const curLevels = () => LEVELS[lang];

  function renderProgress(){
    const L = curLevels(), t = UI[lang];
    progEl.innerHTML='';
    L.forEach((_,i)=>{
      const d=document.createElement('div');
      d.className='dot'+(i<progress?' done':i===progress?' cur':'');
      progEl.appendChild(d);
    });
    const s=document.createElement('div');
    s.className='score';
    s.innerHTML=`${t.scoreWord} <b>${score}</b> · ${progress}/${L.length}`;
    progEl.appendChild(s);
  }

  const escapeHtml = s => s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  function render(){
    const t = UI[lang], L = curLevels();
    document.documentElement.lang = lang;
    document.getElementById('tagline').textContent = t.tagline;
    document.getElementById('btnTR').classList.toggle('on', lang==='tr');
    document.getElementById('btnEN').classList.toggle('on', lang==='en');
    document.getElementById('about').innerHTML = t.about;
    document.getElementById('endMsg').textContent = t.endMsg;
    document.getElementById('endScoreLabel').textContent = t.endScore;
    document.getElementById('restartBtn').textContent = t.restart;

    levelsEl.innerHTML='';
    L.forEach((lv,i)=>{
      const built = lv.make(lv.flag);
      const solved = i<progress, locked = i>progress;
      const card=document.createElement('div');
      card.className='card'+(solved?' solved':'')+(locked?' locked':'');

      if(locked){
        card.innerHTML=`<div class="lv"><span class="num">[${String(i+1).padStart(2,'0')}]</span>
          <span class="cat">???</span></div><div class="locked-msg">${t.locked}</div>`;
        levelsEl.appendChild(card); return;
      }

      card.innerHTML=`
        <div class="lv"><span class="num">[${String(i+1).padStart(2,'0')}]</span><span class="cat">${lv.cat}</span></div>
        <h2>${lv.title}</h2>
        <div class="desc">${lv.desc}</div>
        <div class="blob">${escapeHtml(built.blob)}</div>
        ${solved
          ? `<div class="flagline">✔ ${t.solved} → <b>${escapeHtml(built.answer)}</b></div>
             <div class="info"><span class="info-label">// ${t.infoLabel} · ${lv.cat}</span>${lv.info}</div>`
          : `<div class="answer">
               <input id="in${i}" placeholder="flag{...}" autocomplete="off" autocapitalize="off" spellcheck="false">
               <button class="btn-go" data-go="${i}">${t.submit}</button>
               <button class="ghost" data-hint="${i}">${t.hint}</button>
             </div>
             <div class="hint" id="hint${i}">${lv.hint}</div>
             <div class="feedback" id="fb${i}"></div>`}`;
      levelsEl.appendChild(card);
    });

    const i=progress;
    if(i<L.length){
      const inp=document.getElementById('in'+i);
      const go=()=>submit(i);
      levelsEl.querySelector(`[data-go="${i}"]`).onclick=go;
      levelsEl.querySelector(`[data-hint="${i}"]`).onclick=()=>document.getElementById('hint'+i).classList.add('show');
      if(inp){ inp.focus(); inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();}); }
    }
    endEl.classList.toggle('show', progress>=L.length);
    if(progress>=L.length){
      document.getElementById('finalScore').textContent=score;
      endEl.scrollIntoView({behavior:'smooth'});
    }
    renderProgress();
  }

  const norm = s => (s||'').trim().toLowerCase().replace(/\s+/g,'');

  function submit(i){
    const inp=document.getElementById('in'+i), fb=document.getElementById('fb'+i);
    const val=norm(inp.value); if(!val) return;
    const lvl=curLevels()[i];
    const ans=lvl.make(lvl.flag).answer;
    if(val===norm(ans)){
      const hintUsed=document.getElementById('hint'+i).classList.contains('show');
      score += hintUsed?60:100;
      fb.className='feedback ok'; fb.textContent=UI[lang].correct;
      progress=i+1;
      setTimeout(render,500);
    }else{
      fb.className='feedback no'; fb.textContent=UI[lang].wrong;
      inp.style.borderColor='var(--red)';
      setTimeout(()=>inp.style.borderColor='',600);
    }
  }

  window.setLang=function(l){
    if(l===lang) return;
    if(progress>0 && progress<curLevels().length){
      if(!confirm(UI[lang].switchWarn)) return;
    }
    lang=l; progress=0; score=0;
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  };

  window.resetAll=function(){
    progress=0; score=0; render();
    window.scrollTo({top:0,behavior:'smooth'});
  };

  render();
})();
</script>
</body>
</html>
